name: ClipFabrik Windows-EXE

on:
  push:
    paths: ["clipfabrik/**", ".github/workflows/clipfabrik-exe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clipfabrik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests
      - name: EXE bauen
        run: >
          pyinstaller run.py --onefile --name ClipFabrik --noconfirm
          --add-data "clipfabrik/ui.html;clipfabrik"
          --collect-data imageio_ffmpeg
          --collect-submodules streamlink.plugins
          --collect-data streamlink
          --hidden-import clipfabrik.server
      - name: Kurztest der EXE
        run: dist\ClipFabrik.exe --demo
      - name: Paket
        run: |
          mkdir out
          copy dist\ClipFabrik.exe out\
          copy LIESMICH.txt out\
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFabrik-Windows
          path: clipfabrik/out
